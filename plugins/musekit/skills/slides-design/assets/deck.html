<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>演示文稿标题</title>
<!-- 字体：从 style.md 的「字体」一节复制网页加载地址，放在这里。 -->
<style>
/* 1. style.md 的 Tokens：把它的 :root 整段粘贴在这里（含 --canvas-width 与 --canvas-height）。 */
:root {
  --canvas-width: 1920px;
  --canvas-height: 1080px;
}

/* 2. 骨架：每页一个 <section class="slide">，尺寸就是画布。改画布时同步改下面 @page 的尺寸。 */
html, body { margin: 0; padding: 0; }
.slide {
  position: relative;
  box-sizing: border-box;
  width: var(--canvas-width);
  height: var(--canvas-height);
  overflow: hidden;
  background: var(--color-paper);
  color: var(--color-ink);
}
@page { size: 1920px 1080px; margin: 0; }
@media print {
  html, body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .slide { break-after: page; }
}
/* 放映：一次显示一页，按窗口等比缩放并居中。不要在这一段里写版式。 */
@media screen {
  html, body { height: 100%; overflow: hidden; background: #000; }
  .slide { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(var(--fit, 1)); }
  /* 隐藏而不移出布局：加载时按元素尺寸作画的脚本（如网点模块）在每一页都量得到尺寸。 */
  .slide:not(.is-current) { visibility: hidden; }
}

/* 3. 版式：从这里往下写，只用 style.md 的变量。下面这行清掉浏览器默认外边距，:where() 不加优先级，不会压过你写的类。 */
:where(.slide) :where(h1, h2, h3, h4, p, ul, ol, li, figure, blockquote) { margin: 0; padding: 0; }
</style>
</head>
<body>

<section class="slide" aria-label="第 1 页">
  <!-- 封面 -->
</section>

<section class="slide" aria-label="第 2 页">
  <!-- 下一页 -->
</section>

<script>
// 翻页：→ ↓ 空格 PageDown 下一页；← ↑ PageUp 上一页；Home、End 首尾页；F 全屏。
// 地址里的 #3 直接打开第 3 页；点击右半边下一页、左半边上一页（链接照常打开）。
(() => {
  const slides = [...document.querySelectorAll(".slide")];
  const root = document.documentElement;
  let current = 0;
  const fit = () => {
    const css = getComputedStyle(root);
    const w = parseFloat(css.getPropertyValue("--canvas-width")), h = parseFloat(css.getPropertyValue("--canvas-height"));
    root.style.setProperty("--fit", Math.min(innerWidth / w, innerHeight / h));
  };
  const show = (n) => {
    current = Math.max(0, Math.min(slides.length - 1, n));
    slides.forEach((s, i) => s.classList.toggle("is-current", i === current));
    if (location.hash !== `#${current + 1}`) history.replaceState(null, "", `#${current + 1}`);
  };
  const fromHash = () => show((parseInt(location.hash.slice(1), 10) || 1) - 1);
  addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (["ArrowRight", "ArrowDown", "PageDown", " "].includes(e.key)) show(current + 1);
    else if (["ArrowLeft", "ArrowUp", "PageUp"].includes(e.key)) show(current - 1);
    else if (e.key === "Home") show(0);
    else if (e.key === "End") show(slides.length - 1);
    else if (e.key === "f" || e.key === "F") (document.fullscreenElement ? document.exitFullscreen() : root.requestFullscreen()).catch(() => {});
    else return;
    e.preventDefault();
  });
  addEventListener("click", (e) => {
    if (e.target.closest("a, button, input, select, textarea")) return;
    show(current + (e.clientX > innerWidth / 2 ? 1 : -1));
  });
  addEventListener("resize", fit);
  addEventListener("hashchange", fromHash);
  fit();
  fromHash();
})();
</script>
</body>
</html>
