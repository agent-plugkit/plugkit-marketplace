  --size-meta: 24px;
  --leading-display: 0.9;

}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--color-paper); color: var(--color-ink); font-family: var(--font-text); font-variant-numeric: tabular-nums; }

.shade.b { bottom: 0; height: calc(var(--shade-bottom) * 100%); background: linear-gradient(to top, var(--color-paper) 40%, rgb(13 12 11 / 0)); }
.edge { position: absolute; left: var(--margin); right: var(--margin); font-size: var(--size-edge); line-height: var(--leading-edge); letter-spacing: var(--tracking-edge); }
.top { top: var(--margin); display: flex; justify-content: space-between; align-items: flex-start; }
.top h1 { margin: 0; font: inherit; font-weight: var(--weight-strong); }
.top h1 span, .top p span { display: block; font-family: var(--font-text); font-weight: var(--weight-text); }
.top p { margin: 0; text-align: right; font-weight: var(--weight-strong); }
.bottom { bottom: var(--margin); display: grid; grid-template-columns: auto auto auto; justify-content: space-between; gap: var(--space-3) var(--gutter); font-size: var(--size-body); }
.bottom p { margin: 0; }
.bottom b { display: block; font-weight: var(--weight-strong); color: var(--color-accent); }
.bottom .note { grid-column: 1 / -1; }
.nw { white-space: nowrap; }
