<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>借阅申请如何走向结果</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#f5f4ef}
svg{display:block;width:1600px;height:1400px;font-family:"PingFang SC","Noto Sans CJK SC",Arial,sans-serif}
text{text-rendering:optimizeLegibility}
</style>
</head>
<body>
<!-- 独立示例：坐标服务本图内容，原始关系见同名 .mmd。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1400" viewBox="0 0 1600 1400" role="img" aria-labelledby="title">
<title id="title">借阅申请如何走向结果</title>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2148b8" stroke-width="1.5" stroke-linejoin="round"/></marker>
<marker id="warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b45431" stroke-width="1.5" stroke-linejoin="round"/></marker>
<marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#687186" stroke-width="1.5" stroke-linejoin="round"/></marker>
</defs>
<rect width="1600" height="1400" fill="#f5f4ef"/>
<text x="72" y="64" font-size="16" fill="#2148b8" font-weight="500" text-anchor="start"><tspan x="72" dy="0">02 / DECISION</tspan></text>
<text x="72" y="155" font-size="56" fill="#1f2a44" font-weight="600" text-anchor="start"><tspan x="72" dy="0">借阅申请如何走向结果</tspan></text>
<text x="76" y="209" font-size="23" fill="#687186" font-weight="400" text-anchor="start"><tspan x="76" dy="0">按资料、库存与预约顺序，给每个条件一个明确出口。</tspan></text>
<path d="M72 251H1528" fill="none" stroke="#cdd4df" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"/>
<path d="M148 468V1060" fill="none" stroke="#cdd4df" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"/>
<rect x="280" y="300" width="640" height="84" rx="12" fill="#2148b8" stroke="none" stroke-width="1.5"/>
<text x="312" y="354" font-size="28" fill="#fff" font-weight="500" text-anchor="start"><tspan x="312" dy="0">借阅申请</tspan></text>
<rect x="280" y="465" width="640" height="114" rx="12" fill="#fff" stroke="none" stroke-width="1.5"/>
<text x="312" y="531" font-size="32" fill="#1f2a44" font-weight="500" text-anchor="start"><tspan x="312" dy="0">资料完整？</tspan></text>
<rect x="280" y="720" width="640" height="114" rx="12" fill="#fff" stroke="none" stroke-width="1.5"/>
<text x="312" y="786" font-size="32" fill="#1f2a44" font-weight="500" text-anchor="start"><tspan x="312" dy="0">库存足够？</tspan></text>
<rect x="280" y="968" width="640" height="114" rx="12" fill="#fff" stroke="none" stroke-width="1.5"/>
<text x="312" y="1034" font-size="32" fill="#1f2a44" font-weight="500" text-anchor="start"><tspan x="312" dy="0">允许预约？</tspan></text>
<rect x="1090" y="469" width="374" height="130" rx="12" fill="#f0dfd5" stroke="none" stroke-width="1.5"/>
<text x="1122" y="521" font-size="30" fill="#b45431" font-weight="500" text-anchor="start"><tspan x="1122" dy="0">等待补充</tspan></text>
<text x="1122" y="562" font-size="18" fill="#b45431" font-weight="400" text-anchor="start"><tspan x="1122" dy="0">补齐资料后可再次申请</tspan></text>
<rect x="1090" y="712" width="374" height="120" rx="12" fill="#2148b8" stroke="none" stroke-width="1.5"/>
<text x="1122" y="763" font-size="30" fill="#fff" font-weight="500" text-anchor="start"><tspan x="1122" dy="0">批准借阅</tspan></text>
<text x="1122" y="805" font-size="18" fill="#dce4ff" font-weight="400" text-anchor="start"><tspan x="1122" dy="0">资料完整，库存足够</tspan></text>
<rect x="1090" y="968" width="374" height="114" rx="12" fill="#fff" stroke="#2148b8" stroke-width="1.5"/>
<text x="1122" y="1035" font-size="30" fill="#2148b8" font-weight="500" text-anchor="start"><tspan x="1122" dy="0">加入候补</tspan></text>
<rect x="1090" y="1137" width="374" height="110" rx="12" fill="#e8e9ed" stroke="none" stroke-width="1.5"/>
<text x="1122" y="1203" font-size="30" fill="#1f2a44" font-weight="500" text-anchor="start"><tspan x="1122" dy="0">暂不借出</tspan></text>
<path d="M600 384V465" fill="none" stroke="#2148b8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)" aria-label="借阅申请 → 资料完整？"/>
<path d="M920 522H1090" fill="none" stroke="#b45431" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#warm)" aria-label="资料完整？ → 等待补充：否"/>
<text x="1005" y="504" font-size="21" fill="#b45431" font-weight="400" text-anchor="middle"><tspan x="1005" dy="0">否</tspan></text>
<path d="M1464 534H1515V269H600V300" fill="none" stroke="#b45431" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#warm)" aria-label="等待补充 → 借阅申请：补充后重新提交"/>
<rect x="1024" y="251" width="246" height="36" rx="0" fill="#f5f4ef" stroke="none" stroke-width="1.5"/>
<text x="1147" y="278" font-size="20" fill="#b45431" font-weight="400" text-anchor="middle"><tspan x="1147" dy="0">补充后重新提交</tspan></text>
<path d="M600 579V720" fill="none" stroke="#2148b8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)" aria-label="资料完整？ → 库存足够？：是"/>
<text x="623" y="653" font-size="21" fill="#2148b8" font-weight="400" text-anchor="start"><tspan x="623" dy="0">是</tspan></text>
<path d="M920 776H1090" fill="none" stroke="#2148b8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)" aria-label="库存足够？ → 批准借阅：是"/>
<text x="1005" y="758" font-size="21" fill="#2148b8" font-weight="400" text-anchor="middle"><tspan x="1005" dy="0">是</tspan></text>
<path d="M600 834V968" fill="none" stroke="#2148b8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)" aria-label="库存足够？ → 允许预约？：否"/>
<text x="623" y="906" font-size="21" fill="#2148b8" font-weight="400" text-anchor="start"><tspan x="623" dy="0">否</tspan></text>
<path d="M920 1025H1090" fill="none" stroke="#2148b8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)" aria-label="允许预约？ → 加入候补：是"/>
<text x="1005" y="1007" font-size="21" fill="#2148b8" font-weight="400" text-anchor="middle"><tspan x="1005" dy="0">是</tspan></text>
<path d="M600 1082V1192H1090" fill="none" stroke="#2148b8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)" aria-label="允许预约？ → 暂不借出：否"/>
<text x="623" y="1134" font-size="21" fill="#2148b8" font-weight="400" text-anchor="start"><tspan x="623" dy="0">否</tspan></text>
<rect x="119" y="480" width="58" height="58" rx="29" fill="#f5f4ef" stroke="none" stroke-width="1.5"/>
<text x="148" y="519" font-size="24" fill="#2148b8" font-weight="500" text-anchor="middle"><tspan x="148" dy="0">01</tspan></text>
<text x="148" y="569" font-size="20" fill="#687186" font-weight="400" text-anchor="middle"><tspan x="148" dy="0">资料</tspan></text>
<rect x="119" y="735" width="58" height="58" rx="29" fill="#f5f4ef" stroke="none" stroke-width="1.5"/>
<text x="148" y="774" font-size="24" fill="#2148b8" font-weight="500" text-anchor="middle"><tspan x="148" dy="0">02</tspan></text>
<text x="148" y="824" font-size="20" fill="#687186" font-weight="400" text-anchor="middle"><tspan x="148" dy="0">库存</tspan></text>
<rect x="119" y="983" width="58" height="58" rx="29" fill="#f5f4ef" stroke="none" stroke-width="1.5"/>
<text x="148" y="1022" font-size="24" fill="#2148b8" font-weight="500" text-anchor="middle"><tspan x="148" dy="0">03</tspan></text>
<text x="148" y="1072" font-size="20" fill="#687186" font-weight="400" text-anchor="middle"><tspan x="148" dy="0">预约</tspan></text>
<path d="M72 1310H1528" fill="none" stroke="#cdd4df" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"/>
<text x="76" y="1353" font-size="20" fill="#687186" font-weight="400" text-anchor="start"><tspan x="76" dy="0">待补充保留回路；库存不足继续判断预约。</tspan></text>
<text x="1528" y="1353" font-size="16" fill="#687186" font-weight="400" text-anchor="end"><tspan x="1528" dy="0">独立示例 · 借阅申请</tspan></text>
</svg>
</body>
</html>
