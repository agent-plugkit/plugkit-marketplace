<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>资源预订的两条路径</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#f5f4ef}
svg{display:block;width:1600px;height:1480px;font-family:"PingFang SC","Noto Sans CJK SC",Arial,sans-serif}
text{text-rendering:optimizeLegibility}
</style>
</head>
<body>
<!-- 独立示例：坐标服务本图内容，原始关系见同名 .mmd。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1480" viewBox="0 0 1600 1480" role="img" aria-labelledby="title">
<title id="title">资源预订的两条路径</title>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2148b8" stroke-width="1.5" stroke-linejoin="round"/></marker>
<marker id="warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b45431" stroke-width="1.5" stroke-linejoin="round"/></marker>
<marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#687186" stroke-width="1.5" stroke-linejoin="round"/></marker>
</defs>
<rect width="1600" height="1480" fill="#f5f4ef"/>
<text x="72" y="64" font-size="16" fill="#2148b8" font-weight="500" text-anchor="start"><tspan x="72" dy="0">03 / SEQUENCE</tspan></text>
<text x="72" y="155" font-size="56" fill="#1f2a44" font-weight="600" text-anchor="start"><tspan x="72" dy="0">资源预订的两条路径</tspan></text>
<text x="76" y="209" font-size="23" fill="#687186" font-weight="400" text-anchor="start"><tspan x="76" dy="0">库存为零与库存可用，共享前半段检查，各自返回清楚的结果。</tspan></text>
<path d="M72 251H1528" fill="none" stroke="#cdd4df" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"/>
<rect x="72" y="281" width="238" height="80" rx="12" fill="#fff" stroke="none" stroke-width="1.5"/>
<text x="191" y="331" font-size="26" fill="#1f2a44" font-weight="500" text-anchor="middle"><tspan x="191" dy="0">访问者</tspan></text>
<rect x="480" y="281" width="238" height="80" rx="12" fill="#fff" stroke="none" stroke-width="1.5"/>
<text x="599" y="331" font-size="26" fill="#1f2a44" font-weight="500" text-anchor="middle"><tspan x="599" dy="0">前端</tspan></text>
<rect x="880" y="281" width="238" height="80" rx="12" fill="#2148b8" stroke="none" stroke-width="1.5"/>
<text x="999" y="331" font-size="26" fill="#fff" font-weight="500" text-anchor="middle"><tspan x="999" dy="0">服务</tspan></text>
<rect x="1288" y="281" width="238" height="80" rx="12" fill="#fff" stroke="none" stroke-width="1.5"/>
<text x="1407" y="331" font-size="26" fill="#1f2a44" font-weight="500" text-anchor="middle"><tspan x="1407" dy="0">存储</tspan></text>
<rect x="72" y="684" width="1456" height="207" rx="8" fill="#efe4dc" stroke="none" stroke-width="1.5"/>
<text x="96" y="716" font-size="18" fill="#b45431" font-weight="500" text-anchor="start"><tspan x="96" dy="0">剩余数量为 0</tspan></text>
<rect x="72" y="921" width="1456" height="305" rx="8" fill="#e9eef9" stroke="none" stroke-width="1.5"/>
<text x="96" y="953" font-size="18" fill="#2148b8" font-weight="500" text-anchor="start"><tspan x="96" dy="0">剩余数量大于 0</tspan></text>
<path d="M191 361V1208" fill="none" stroke="#cdd4df" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 7" aria-hidden="true"/>
<path d="M599 361V1208" fill="none" stroke="#cdd4df" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 7" aria-hidden="true"/>
<path d="M999 361V1208" fill="none" stroke="#cdd4df" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 7" aria-hidden="true"/>
<path d="M1407 361V1208" fill="none" stroke="#cdd4df" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 7" aria-hidden="true"/>
<path d="M191 432H599" fill="none" stroke="#2148b8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)" aria-label="1. 访问者 → 前端：提交预订"/>
<text x="395" y="414" font-size="23" fill="#1f2a44" font-weight="400" text-anchor="middle"><tspan x="395" dy="0">提交预订</tspan></text>
<text x="166" y="441" font-size="16" fill="#687186" font-weight="400" text-anchor="end"><tspan x="166" dy="0">1</tspan></text>
<path d="M599 504H999" fill="none" stroke="#2148b8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)" aria-label="2. 前端 → 服务：请求号 + 资源编号"/>
<text x="799" y="486" font-size="23" fill="#1f2a44" font-weight="400" text-anchor="middle"><tspan x="799" dy="0">请求号 + 资源编号</tspan></text>
<text x="574" y="513" font-size="16" fill="#687186" font-weight="400" text-anchor="end"><tspan x="574" dy="0">2</tspan></text>
<path d="M999 576H1407" fill="none" stroke="#2148b8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)" aria-label="3. 服务 → 存储：检查剩余库存"/>
<text x="1203" y="558" font-size="23" fill="#1f2a44" font-weight="400" text-anchor="middle"><tspan x="1203" dy="0">检查剩余库存</tspan></text>
<text x="974" y="585" font-size="16" fill="#687186" font-weight="400" text-anchor="end"><tspan x="974" dy="0">3</tspan></text>
<path d="M1407 650H999" fill="none" stroke="#2148b8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#blue)" aria-label="4. 存储 → 服务：剩余数量"/>
<text x="1203" y="632" font-size="23" fill="#1f2a44" font-weight="400" text-anchor="middle"><tspan x="1203" dy="0">剩余数量</tspan></text>
<text x="1432" y="659" font-size="16" fill="#687186" font-weight="400" text-anchor="start"><tspan x="1432" dy="0">4</tspan></text>
<path d="M999 780H599" fill="none" stroke="#b45431" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#warm)" aria-label="5. 库存为零，服务 → 前端：已满，保持原输入"/>
<text x="799" y="762" font-size="23" fill="#b45431" font-weight="400" text-anchor="middle"><tspan x="799" dy="0">已满，保持原输入</tspan></text>
<text x="1024" y="789" font-size="16" fill="#b45431" font-weight="400" text-anchor="start"><tspan x="1024" dy="0">5</tspan></text>
<path d="M599 859H191" fill="none" stroke="#b45431" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#warm)" aria-label="6. 库存为零，前端 → 访问者：显示候补入口"/>
<text x="395" y="841" font-size="23" fill="#b45431" font-weight="400" text-anchor="middle"><tspan x="395" dy="0">显示候补入口</tspan></text>
<text x="624" y="868" font-size="16" fill="#b45431" font-weight="400" text-anchor="start"><tspan x="624" dy="0">6</tspan></text>
<path d="M999 1020H1407" fill="none" stroke="#2148b8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)" aria-label="7. 库存大于零，服务 → 存储：占用资源并保存请求号"/>
<text x="1203" y="1002" font-size="23" fill="#1f2a44" font-weight="400" text-anchor="middle"><tspan x="1203" dy="0">占用资源并保存请求号</tspan></text>
<text x="974" y="1029" font-size="16" fill="#687186" font-weight="400" text-anchor="end"><tspan x="974" dy="0">7</tspan></text>
<path d="M999 1099H599" fill="none" stroke="#2148b8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#blue)" aria-label="8. 库存大于零，服务 → 前端：确认编号"/>
<text x="799" y="1081" font-size="23" fill="#1f2a44" font-weight="400" text-anchor="middle"><tspan x="799" dy="0">确认编号</tspan></text>
<text x="1024" y="1108" font-size="16" fill="#687186" font-weight="400" text-anchor="start"><tspan x="1024" dy="0">8</tspan></text>
<path d="M599 1178H191" fill="none" stroke="#2148b8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#blue)" aria-label="9. 库存大于零，前端 → 访问者：展示预订成功"/>
<text x="395" y="1160" font-size="23" fill="#1f2a44" font-weight="400" text-anchor="middle"><tspan x="395" dy="0">展示预订成功</tspan></text>
<text x="624" y="1187" font-size="16" fill="#687186" font-weight="400" text-anchor="start"><tspan x="624" dy="0">9</tspan></text>
<rect x="877" y="1260" width="651" height="78" rx="8" fill="#fff" stroke="#cdd4df" stroke-width="1.5"/>
<text x="903" y="1290" font-size="14" fill="#687186" font-weight="400" text-anchor="start"><tspan x="903" dy="0">服务 / 存储 · 注释</tspan></text>
<text x="903" y="1319" font-size="22" fill="#1f2a44" font-weight="500" text-anchor="start"><tspan x="903" dy="0">同一请求号只处理一次</tspan></text>
<path d="M72 1390H1528" fill="none" stroke="#cdd4df" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"/>
<text x="76" y="1430" font-size="18" fill="#687186" font-weight="400" text-anchor="start"><tspan x="76" dy="0">时间自上而下</tspan></text>
<path d="M440 1423H500" fill="none" stroke="#2148b8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)" aria-hidden="true"/>
<text x="520" y="1430" font-size="18" fill="#687186" font-weight="400" text-anchor="start"><tspan x="520" dy="0">请求</tspan></text>
<path d="M690 1423H750" fill="none" stroke="#2148b8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#blue)" aria-hidden="true"/>
<text x="770" y="1430" font-size="18" fill="#687186" font-weight="400" text-anchor="start"><tspan x="770" dy="0">返回</tspan></text>
<text x="1528" y="1430" font-size="16" fill="#687186" font-weight="400" text-anchor="end"><tspan x="1528" dy="0">独立示例 · 资源预订</tspan></text>
</svg>
</body>
</html>
