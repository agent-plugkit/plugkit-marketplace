name: musekit
version: "1.0.0"
description: "设计风格库与场景制作工作流：按设计元素分类的 Seed、组合成风格的 Template，以及网页、平面、图解、学术图和文章配图。"
author:
  name: "Agent Plugkit"
category: general
tags:
  - design
  - inspiration
  - ui
  - graphic
  - diagram
  - scientific-figure
  - article-illustration

components:
  skills:
    - name: musepool
      path: skills/musepool
      description: "设计风格与灵感库：按场景检索已验证的风格 Template，组合 Seed，或把用户品牌整理成同形风格。"
    - name: web-design
      path: skills/web-design
      description: "设计并实现网站、落地页与 Web App 界面，从 musepool 取风格并在浏览器评审。"
    - name: graphic-design
      path: skills/graphic-design
      description: "制作海报、封面、社媒图等单页平面作品，从 musepool 取风格，用排版或生图完成并评审。"
    - name: diagram-design
      path: skills/diagram-design
      description: "把 Mermaid 或关系说明制作成可直接微调的图解，内置尺寸测量、端点对齐与分散、构图整理、诊断修复提示、节点查找、布局编辑与验证后离线交付。"
    - name: scientific-figure
      path: skills/scientific-figure
      description: "基于原始资料制作学术数据图与科学示意图，核对数据编码、标注和出版尺寸。"
    - name: article-illustration
      path: skills/article-illustration
      description: "为一整篇文章编排配图，确认后交给图解、平面或学术图 Skill，并把 PNG 插入不改原文的副本。"

platform:
  codex:
    interface:
      displayName: "Musekit"
      shortDescription: "从设计风格到场景作品"
      longDescription: "Musepool 把按设计元素分类的 Seed 组合成风格 Template，按场景解析成 style.md；网页、平面、图解或学术图工作流用它完成制作与评审。文章配图由 article-illustration 编排后交给对应场景。用户的品牌规范或既有设计系统会被整理成同形的风格。"
      category: "General"
      developerName: "Agent Plugkit"
      capabilities:
        - "Interactive"
        - "Read"
        - "Write"
      defaultPrompt:
        - "为这项设计挑一个合适的风格，并用对应场景的工作流完成作品。"
        - "为这篇文章安排配图，确认方案后再交给对应场景制作。"
