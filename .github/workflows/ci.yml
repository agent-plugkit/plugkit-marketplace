name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Install browser for diagram checks
        run: npx playwright install --with-deps chromium

      - name: Build and validate
        run: npm run check

      - name: Generated artifacts must not drift
        run: |
          repository_status="$(git status --porcelain --untracked-files=all)"
          if [ -n "$repository_status" ]; then
            printf '%s\n' "$repository_status"
            exit 1
          fi

  musepool-scripts:
    # muse_local.py and sync-seeds.mjs write files from archives and manage the seed cache;
    # run their tests where path rules, locking and file systems differ from Linux.
    name: Musepool scripts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Check out files byte for byte
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Seed snapshot matches seeds.lock
        run: node scripts/sync-seeds.mjs --check

      - name: Musepool script tests
        env:
          PYTHON: python
        run: node --test tests/musepool-cache.test.mjs
